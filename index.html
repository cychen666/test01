<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>繽紛幸運大轉盤 - Custom Wheel of Fortune</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#06b6d4',
                            600: '#0891b2',
                            700: '#0e7490',
                            900: '#164e63',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'bounce-short': 'bounce 0.8s ease-in-out infinite',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom styles for canvas shadow and layout adjustments */
        .wheel-glow {
            filter: drop-shadow(0 0 25px rgba(14, 116, 144, 0.35));
        }
        .pointer-shadow {
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4));
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(71, 85, 105, 1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-cyan-500 selection:text-white flex flex-col">

    <!-- Header -->

                </div>
                <div>
                    <h1 class="font-bold text-lg sm:text-xl bg-gradient-to-r from-white via-slate-200 to-cyan-400 bg-clip-text text-transparent">繽紛幸運大轉盤</h1>
                    <p class="text-xs text-slate-400 hidden sm:block">自訂選項 · 隨機決策 · 趣味抽獎</p>
                </div>
            </div>

            <!-- Top Controls -->
            <div class="flex items-center gap-2 sm:gap-3">

                    <i id="soundIcon" class="fa-solid fa-volume-high text-cyan-400"></i>
                    <span class="hidden md:inline text-xs font-medium">音效</span>
                </button>
                <button onclick="resetDefaultItems()" class="p-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition flex items-center gap-2 text-sm border border-slate-700/60" title="重置轉盤">
                    <i class="fa-solid fa-rotate-left text-amber-400"></i>
                    <span class="hidden md:inline text-xs font-medium">重置</span>

            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- Left Side: Wheel Display & Primary Controls (lg:col-span-7) -->
        <section class="lg:col-span-7 flex flex-col items-center justify-center space-y-6">
            
            <!-- Wheel Outer Container -->
            <div class="relative w-full max-w-[480px] aspect-square flex items-center justify-center my-2 p-2">

                </div>

                <!-- Canvas Wrapper -->
                <div class="relative w-full h-full rounded-full border-4 border-slate-800 shadow-2xl bg-slate-900 wheel-glow overflow-hidden p-1">
                    <canvas id="wheelCanvas" class="w-full h-full rounded-full cursor-pointer transition-transform duration-75"></canvas>
                    
                    <!-- Center Spin Button -->
                    <button id="centerSpinBtn" onclick="spinWheel()" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 border-4 border-cyan-400/80 shadow-2xl hover:scale-105 active:scale-95 transition-all duration-200 flex flex-col items-center justify-center z-10 group">
                        <span class="text-xs font-bold tracking-wider text-slate-400 group-hover:text-cyan-300">SPIN</span>
                        <span class="text-base sm:text-lg font-black text-white group-hover:text-cyan-400">開始</span>

                    </button>

            <!-- Spin Action Controls -->
            <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 p-4 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xl">

                <!-- Add Item Form -->

                        清除紀錄

    <!-- Winner Modal Overlay -->

        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl transform scale-90 transition-transform duration-300 id-modal-card">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-400 to-rose-500 flex items-center justify-center text-3xl text-white mx-auto mb-4 shadow-lg shadow-amber-500/30 animate-bounce-short">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h3 class="text-xs font-semibold text-cyan-400 uppercase tracking-widest mb-1">恭喜抽中！</h3>
            <div id="winnerText" class="text-2xl sm:text-3xl font-extrabold text-white my-3 break-words px-2"></div>
            
            <div class="mt-6 flex flex-col gap-2">
                <button onclick="closeWinnerModal()" class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 text-white font-bold text-sm shadow-lg shadow-cyan-500/25 hover:brightness-110 transition">
                    太棒了！
                </button>
                <button id="modalRemoveBtn" onclick="removeWinnerAndClose()" class="w-full py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-rose-950/50 text-rose-400 border border-slate-700/80 hover:border-rose-800/80 text-xs font-semibold transition">
                    <i class="fa-solid fa-trash-can mr-1"></i> 移除此選項並繼續
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- State Management ---
        let items = [];
        let isSoundEnabled = true;
        let isSpinning = false;
        let currentRotation = 0; // Cumulative angle in radians
        let lastWinnerItem = null;
        let audioCtx = null;

        // Preset Data
        const PRESETS = {
            food: [
                { text: '🍜 拉麵', color: '#f43f5e' },
                { text: '🍱 火腿便當', color: '#fb923c' },
                { text: '🍕 披薩', color: '#facc15' },
                { text: '🍔 漢堡薯條', color: '#4ade80' },
                { text: '🥗 健康沙拉', color: '#2dd4bf' },
                { text: '🍣 日式壽司', color: '#38bdf8' },
                { text: '🍲 麻辣火鍋', color: '#818cf8' },
                { text: '🥩 炭烤牛排', color: '#c084fc' }
            ],
            truthOrDare: [
                { text: '🗣️ 真心話：最近的祕密', color: '#ef4444' },
                { text: '💃 大冒險：搞笑跳舞10秒', color: '#f97316' },
                { text: '🗣️ 真心話：第一次心動', color: '#eab308' },
                { text: '🎤 大冒險：清唱一首歌', color: '#10b981' },
                { text: '🗣️ 真心話：手機桌布原因', color: '#06b6d4' },
                { text: '🤪 大冒險：做做怪表情拍照', color: '#6366f1' }
            ],
            numbers: [
                { text: '幸運號 1', color: '#f43f5e' },
                { text: '幸運號 2', color: '#fb923c' },
                { text: '幸運號 3', color: '#facc15' },
                { text: '幸運號 4', color: '#4ade80' },
                { text: '幸運號 5', color: '#2dd4bf' },
                { text: '幸運號 6', color: '#38bdf8' },
                { text: '幸運號 7', color: '#818cf8' },
                { text: '幸運號 8', color: '#c084fc' }
            ],
            tasks: [
                { text: '🧹 掃地拖地', color: '#06b6d4' },
                { text: '🍽️ 洗碗盤', color: '#3b82f6' },
                { text: '🗑️ 倒垃圾', color: '#6366f1' },
                { text: '🧺 折衣服', color: '#8b5cf6' },
                { text: '🪟 擦窗戶', color: '#ec4899' },
                { text: '☕ 煮咖啡/買飲料', color: '#f43f5e' }
            ]
        };

        // Vibrant Color Palette Generator
        const COLOR_PALETTE = [
            '#f43f5e', '#fb923c', '#facc15', '#4ade80', 
            '#2dd4bf', '#38bdf8', '#818cf8', '#c084fc', 
            '#e879f9', '#fb7185', '#34d399', '#60a5fa'
        ];

        // --- Web Audio API Synth for Tick and Fanfare ---
        function initAudio() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    audioCtx = new AudioContext();
                }
            }
        }

        function playTickSound() {
            if (!isSoundEnabled) return;
            try {
                initAudio();
                if (!audioCtx) return;
                
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
                
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {
                // Audio fallback silence
            }
        }

        function playWinSound() {
            if (!isSoundEnabled) return;
            try {
                initAudio();
                if (!audioCtx) return;

                const notes = [261.63, 329.63, 392.00, 523.25]; // C, E, G, C
                notes.forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    
                    const startTime = audioCtx.currentTime + (idx * 0.08);
                    gain.gain.setValueAtTime(0.2, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
                    
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(startTime);
                    osc.stop(startTime + 0.3);
                });
            } catch (e) {
                // Audio fallback silence
            }
        }

        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            const icon = document.getElementById('soundIcon');
            if (isSoundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-cyan-400';
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-slate-500';
            }
        }

        // --- Wheel Drawing Logic ---
        function getCanvasAndContext() {
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            return { canvas, ctx };
        }

        function resizeCanvas() {
            const { canvas } = getCanvasAndContext();
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            
            drawWheel();
        }

        function drawWheel() {
            const { canvas, ctx } = getCanvasAndContext();
            if (!canvas.width || !canvas.height) return;

            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = Math.min(centerX, centerY) - 10;

            ctx.clearRect(0, 0, width, height);

            if (items.length === 0) {
                // Empty state wheel
                ctx.save();
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                ctx.fillStyle = '#1e293b';
                ctx.fill();
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.fillStyle = '#94a3b8';
                ctx.font = `bold ${Math.max(14, radius * 0.1)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('請新增選項', centerX, centerY);
                ctx.restore();
                return;
            }

            const sliceAngle = (Math.PI * 2) / items.length;

            ctx.save();
            // Move origin to center
            ctx.translate(centerX, centerY);
            // Rotate wheel by currentRotation
            ctx.rotate(currentRotation);

            // Draw slices
            items.forEach((item, index) => {
                const startAngle = index * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                // Fill slice
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = item.color;
                ctx.fill();

                // Inner divider border
                ctx.strokeStyle = 'rgba(15, 23, 42, 0.4)';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Slice Text
                ctx.save();
                const textAngle = startAngle + sliceAngle / 2;
                ctx.rotate(textAngle);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#ffffff';

                // Shadow for legibility
                ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
                ctx.shadowBlur = 4;

                const fontSize = Math.max(12, Math.min(22, (radius * 0.35) / Math.sqrt(item.text.length)));
                ctx.font = `bold ${fontSize}px sans-serif`;

                // Truncate text if too long
                let displayText = item.text;
                if (displayText.length > 12) {
                    displayText = displayText.substring(0, 10) + '...';
                }

                ctx.fillText(displayText, radius - 24, 0);
                ctx.restore();
            });

            // Draw outer border ring on canvas
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 6;
            ctx.stroke();

            ctx.restore();
        }

        // --- Physics & Spinning Engine ---
        let spinAnimationId = null;
        let lastPassedIndex = -1;

        function spinWheel() {
            if (isSpinning || items.length === 0) return;

            initAudio();
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('centerSpinBtn').disabled = true;

            // Pick a winning index randomly
            const winningIndex = Math.floor(Math.random() * items.length);
            const sliceAngle = (Math.PI * 2) / items.length;

            // Target rotation setup:
            // Top pointer is located at angle -PI/2 (or 3PI/2)
            // Target slice center needs to align with top pointer (-PI/2)
            const targetSliceCenter = winningIndex * sliceAngle + sliceAngle / 2;
            
            // Calculate final angle so that: (finalRotation + targetSliceCenter) % 2PI = -PI/2 (or 3PI/2)
            const desiredOffset = (Math.PI * 3 / 2) - targetSliceCenter;
            
            // Add extra full rotations (5 to 8 rotations) for drama
            const fullRotations = (5 + Math.floor(Math.random() * 4)) * Math.PI * 2;
            
            // Calculate total target rotation relative to currentRotation
            const currentMod = currentRotation % (Math.PI * 2);
            const totalRotationNeeded = fullRotations + (desiredOffset - currentMod);
            const startRotation = currentRotation;
            const targetRotation = currentRotation + totalRotationNeeded;

            const startTime = performance.now();
            const duration = 4500 + Math.random() * 1000; // ~4.5 - 5.5 seconds

            // Cubic Ease-Out curve for realistic smooth deceleration
            function easeOutCubic(t) {
                return 1 - Math.pow(1 - t, 3);
            }

            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easedProgress = easeOutCubic(progress);

                currentRotation = startRotation + totalRotationNeeded * easedProgress;
                drawWheel();

                // Calculate current slice under pointer to trigger tick sound
                const normalizedAngle = (Math.PI * 3 / 2 - (currentRotation % (Math.PI * 2)) + Math.PI * 4) % (Math.PI * 2);
                const currentPointerSliceIndex = Math.floor(normalizedAngle / sliceAngle) % items.length;

                if (currentPointerSliceIndex !== lastPassedIndex) {
                    playTickSound();
                    lastPassedIndex = currentPointerSliceIndex;
                }

                if (progress < 1) {
                    spinAnimationId = requestAnimationFrame(animate);
                } else {
                    // Spin finished!
                    isSpinning = false;
                    document.getElementById('spinBtn').disabled = false;
                    document.getElementById('centerSpinBtn').disabled = false;
                    
                    lastWinnerItem = items[winningIndex];
                    onWin(items[winningIndex]);
                }
            }

            spinAnimationId = requestAnimationFrame(animate);
        }

        // --- Win Event Handling ---
        function onWin(winner) {
            playWinSound();

            // Trigger Confetti fireworks
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }

            // Record History
            addHistoryRecord(winner.text);

            // Show Winner Modal
            const modal = document.getElementById('winnerModal');
            const winnerText = document.getElementById('winnerText');
            const modalRemoveBtn = document.getElementById('modalRemoveBtn');

            winnerText.innerText = winner.text;
            winnerText.style.color = winner.color;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('.id-modal-card').classList.remove('scale-90');
            modal.querySelector('.id-modal-card').classList.add('scale-100');

            // Auto-remove mode check
            const removeOnWin = document.getElementById('removeOnWin').checked;
            if (removeOnWin) {
                setTimeout(() => {
                    removeWinnerAndClose();
                }, 1800);
            }
        }

        function closeWinnerModal() {
            const modal = document.getElementById('winnerModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('.id-modal-card').classList.remove('scale-100');
            modal.querySelector('.id-modal-card').classList.add('scale-90');
        }

        function removeWinnerAndClose() {
            if (lastWinnerItem) {
                const idx = items.findIndex(i => i.id === lastWinnerItem.id);
                if (idx !== -1) {
                    removeItem(idx);
                }
            }
            closeWinnerModal();
        }

        // --- History Log Logic ---
        function addHistoryRecord(text) {
            const historyList = document.getElementById('historyList');
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            if (historyList.querySelector('p')) {
                historyList.innerHTML = '';
            }

            const itemEl = document.createElement('div');
            itemEl.className = 'flex items-center justify-between bg-slate-800/60 border border-slate-700/50 rounded-lg px-3 py-1.5 text-xs text-slate-200 animate-fadeIn';
            itemEl.innerHTML = `
                <span class="font-medium text-cyan-300">${escapeHtml(text)}</span>
                <span class="text-[10px] text-slate-500">${timeStr}</span>
            `;
            historyList.prepend(itemEl);
        }

        function clearHistory() {
            document.getElementById('historyList').innerHTML = '<p class="text-slate-600 italic text-center py-2">尚未開始轉動...</p>';
        }

        // --- Option Items CRUD & Management ---
        function renderItemList() {
            const itemList = document.getElementById('itemList');
            const itemCount = document.getElementById('itemCount');
            itemCount.innerText = items.length;

            itemList.innerHTML = '';

            items.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2 bg-slate-950/60 border border-slate-800 rounded-xl p-2 group hover:border-slate-700 transition';
                row.innerHTML = `
                    <input type="color" value="${item.color}" onchange="updateItemColor(${index}, this.value)" class="w-7 h-7 rounded-lg border border-slate-700 bg-transparent cursor-pointer p-0 shrink-0">
                    <input type="text" value="${escapeHtml(item.text)}" onchange="updateItemText(${index}, this.value)" class="flex-1 bg-transparent border-none text-xs sm:text-sm text-slate-200 focus:outline-none focus:ring-1 focus:ring-cyan-500 rounded px-1">
                    <button onclick="removeItem(${index})" class="p-1.5 text-slate-500 hover:text-rose-400 transition" title="刪除此格">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                `;
                itemList.appendChild(row);
            });

            drawWheel();
        }

        function handleAddItem(e) {
            e.preventDefault();
            const textInput = document.getElementById('newItemText');
            const colorInput = document.getElementById('newItemColor');

            const text = textInput.value.trim();
            if (!text) return;

            items.push({
                id: Date.now() + Math.random(),
                text: text,
                color: colorInput.value
            });

            textInput.value = '';
            // Pick next random color for color picker
            colorInput.value = COLOR_PALETTE[items.length % COLOR_PALETTE.length];

            renderItemList();
        }

        function updateItemText(index, newText) {
            if (index >= 0 && index < items.length) {
                items[index].text = newText.trim() || '項目';
                drawWheel();
            }
        }

        function updateItemColor(index, newColor) {
            if (index >= 0 && index < items.length) {
                items[index].color = newColor;
                drawWheel();
            }
        }

        function removeItem(index) {
            if (index >= 0 && index < items.length) {
                items.splice(index, 1);
                renderItemList();
            }
        }

        function shuffleItems() {
            if (items.length <= 1) return;
            for (let i = items.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [items[i], items[j]] = [items[j], items[i]];
            }
            renderItemList();
        }

        function recolorAllSlices() {
            items.forEach((item, idx) => {
                item.color = COLOR_PALETTE[idx % COLOR_PALETTE.length];
            });
            renderItemList();
        }

        function loadPreset(key) {
            if (PRESETS[key]) {
                items = PRESETS[key].map(item => ({
                    id: Date.now() + Math.random(),
                    text: item.text,
                    color: item.color
                }));
                renderItemList();
            }
        }

        function resetDefaultItems() {
            loadPreset('food');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // --- Lifecycle & Initialization ---
        window.addEventListener('resize', resizeCanvas);

        window.onload = function() {
            // Initial Preset
            loadPreset('food');
            
            // Set canvas size after DOM render
            setTimeout(() => {
                resizeCanvas();
            }, 50);
        };
    </script>
</body>
</html>
